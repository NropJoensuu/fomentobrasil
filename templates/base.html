<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fomento Brasil{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-fomento">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="{{ url_for('main.index') }}">
        Fomento<span style="color: var(--cor-destaque);">Brasil</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navFomento">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navFomento">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.listar_oportunidades') }}">Oportunidades</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.nova_oportunidade') }}">Cadastrar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  {% block hero %}{% endblock %}

  <main class="py-5">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="footer-fomento py-4 mt-5">
    <div class="container text-center">
      <p class="mb-1">Fomento Brasil — Centralizando oportunidades de financiamento científico</p>
      <p class="mb-0"><a href="mailto:dev@fomentobrasil.com.br">dev@fomentobrasil.com.br</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    [...tooltipTriggerList].forEach(el => new bootstrap.Tooltip(el));
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
