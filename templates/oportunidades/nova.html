<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Nova Oportunidade — Fomento Brasil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Nova Oportunidade</h1>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Título <span class="text-danger">*</span></label>
        <input type="text" name="titulo" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Instituição Financiadora <span class="text-danger">*</span>
          <span data-bs-toggle="tooltip" title="Quem origina o recurso financeiro (ex: CNPq, FAPESP, FACEPE).">ℹ️</span>
        </label>
        <input type="text" name="instituicao_financiadora" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Instituição Executora
          <span data-bs-toggle="tooltip" title="Quem usa o recurso na prática, executando o projeto (ex: uma universidade ou laboratório). Deixe em branco se não especificado no edital.">ℹ️</span>
        </label>
        <input type="text" name="instituicao_executora" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">
          Instituição Beneficiária
          <span data-bs-toggle="tooltip" title="Intermediária que recebe o recurso da financiadora e repassa para a executora (comum em fundações de apoio, ex: FAPEU, FUNDEP). Deixe em branco quando não houver.">ℹ️</span>
        </label>
        <input type="text" name="instituicao_beneficiaria" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">
          Linha de Fomento <span class="text-danger">*</span>
          <span data-bs-toggle="tooltip" title="Finalidade do fomento: o que a chamada se propõe a apoiar.">ℹ️</span>
        </label>
        <select name="linha_de_fomento" class="form-select" required>
          <option value="auxilio_pesquisa">Auxílio Pesquisa</option>
          <option value="auxilio_inovacao">Auxílio Inovação</option>
          <option value="auxilio_divulgacao_cientifica">Auxílio Divulgação Científica</option>
          <option value="apoio_formacao_capacitacao">Apoio Formação/Capacitação</option>
          <option value="apoio_redes_grupos_pesquisa">Apoio a Redes/Grupos de Pesquisa</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Tipo de Instrumento <span class="text-danger">*</span>
          <span data-bs-toggle="tooltip" title="Instrumento administrativo/legal usado para veicular a chamada, distinto da linha de fomento.">ℹ️</span>
        </label>
        <select name="tipo_instrumento" class="form-select" required>
          <option value="chamada_publica_edital">Chamada Pública/Edital</option>
          <option value="chamamento_publico">Chamamento Público</option>
          <option value="premio">Prêmio</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Natureza do Recurso <span class="text-danger">*</span>
          <span data-bs-toggle="tooltip" title="O que a linha de fomento concede na prática. Pode marcar mais de um valor.">ℹ️</span>
        </label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="natureza_recurso" value="custeio" id="natureza_custeio">
          <label class="form-check-label" for="natureza_custeio">Custeio</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="natureza_recurso" value="capital" id="natureza_capital">
          <label class="form-check-label" for="natureza_capital">Capital</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="natureza_recurso" value="bolsa" id="natureza_bolsa">
          <label class="form-check-label" for="natureza_bolsa">Bolsa</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Público-Alvo <span class="text-danger">*</span>
          <span data-bs-toggle="tooltip" title="Quem pode se candidatar. Pode marcar mais de um valor. Pesquisador não é sinônimo de doutor.">ℹ️</span>
        </label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="publico_alvo" value="pesquisadores" id="publico_pesquisadores">
          <label class="form-check-label" for="publico_pesquisadores">Pesquisadores</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="publico_alvo" value="empresas" id="publico_empresas">
          <label class="form-check-label" for="publico_empresas">Empresas</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="publico_alvo" value="startups" id="publico_startups">
          <label class="form-check-label" for="publico_startups">Startups</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="publico_alvo" value="ict" id="publico_ict">
          <label class="form-check-label" for="publico_ict">ICT</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="publico_alvo" value="mestrandos" id="publico_mestrandos">
          <label class="form-check-label" for="publico_mestrandos">Mestrandos</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="publico_alvo" value="doutorandos" id="publico_doutorandos">
          <label class="form-check-label" for="publico_doutorandos">Doutorandos</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="publico_alvo" value="ies" id="publico_ies">
          <label class="form-check-label" for="publico_ies">IES</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="publico_alvo" value="governo" id="publico_governo">
          <label class="form-check-label" for="publico_governo">Governo</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Tipo de Parceria
          <span data-bs-toggle="tooltip" title="Escopo da parceria entre instituições, quando houver.">ℹ️</span>
        </label>
        <select name="tipo_parceria" class="form-select">
          <option value="">Não se aplica</option>
          <option value="nacional">Nacional</option>
          <option value="regional">Regional</option>
          <option value="internacional">Internacional</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Modalidade de Pessoa
          <span data-bs-toggle="tooltip" title="Só relevante quando a linha de fomento é Apoio Formação/Capacitação.">ℹ️</span>
        </label>
        <select name="modalidade_pessoa" class="form-select">
          <option value="">Não se aplica</option>
          <option value="atracao">Atração</option>
          <option value="fixacao">Fixação</option>
          <option value="capacitacao_exterior">Capacitação no Exterior</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Área do Conhecimento
          <span data-bs-toggle="tooltip" title="Separe múltiplas áreas por vírgula. Ex: Ciência da Computação, Engenharia, Física">ℹ️</span>
        </label>
        <input type="text" name="area_conhecimento" class="form-control" placeholder="Ex: Física, Química, Engenharia">
      </div>

      <div class="mb-3">
        <label class="form-label">
          Data Prevista do Resultado
          <span data-bs-toggle="tooltip" title="Data prevista de divulgação do resultado da chamada, distinta da data-fim de submissão.">ℹ️</span>
        </label>
        <input type="date" name="data_resultado_previsto" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Link do Edital <span class="text-danger">*</span></label>
        <input type="url" name="link" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    [...tooltipTriggerList].forEach(el => new bootstrap.Tooltip(el));
  </script>
</body>
</html>
