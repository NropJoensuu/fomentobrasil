<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Oportunidades — Fomento Brasil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Oportunidades</h1>
      <a href="{{ url_for('main.nova_oportunidade') }}" class="btn btn-primary">Nova Oportunidade</a>
    </div>
    <table class="table bg-white">
      <thead>
        <tr><th>Título</th><th>Instituição</th><th>Tipo</th><th>Fonte</th><th>Link</th></tr>
      </thead>
      <tbody>
        {% for o in oportunidades %}
        <tr>
          <td>{{ o.titulo }}</td>
          <td>{{ o.instituicao }}</td>
          <td>{{ o.tipo }}</td>
          <td>{{ o.fonte }}</td>
          <td><a href="{{ o.link }}" target="_blank">Ver edital</a></td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-center text-muted">Nenhuma oportunidade cadastrada ainda.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
